name: Supabase Free-Tier Keep-Alive

on:
  schedule:
    # Runs daily at 05:30 UTC (11:00 AM IST)
    - cron: '30 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping Supabase Keepalive
    runs-on: ubuntu-latest
    steps:
      - name: Send GET Request to Keepalive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Required secrets SUPABASE_URL or SUPABASE_ANON_KEY are missing."
            exit 1
          fi

          # Strip trailing slashes from URL if present
          URL="${SUPABASE_URL%/}"

          echo "Pinging Supabase keepalive RPC endpoint at $URL/rest/v1/rpc/keepalive ..."
          response=$(curl --fail -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          http_code=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS/d')

          echo "HTTP Response Status: $http_code"
          echo "Keepalive RPC output (active listings count): $body"

          if [ "$http_code" -ne 200 ]; then
            echo "::error::Keep-alive request failed with status $http_code"
            exit 1
          fi

          echo "Keep-alive ping completed successfully. Database is active!"
